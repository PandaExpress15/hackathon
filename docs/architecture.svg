<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
  <title id="title">CareerProof AI architecture</title>
  <desc id="desc">A left-to-right flow from dataset input through validation, local AI interpretation, structured plan validation, deterministic calculation, and evidence output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#F3F7FA"/><stop offset="1" stop-color="#EAF5F0"/></linearGradient>
    <linearGradient id="hero" x1="0" x2="1"><stop offset="0" stop-color="#102A43"/><stop offset="1" stop-color="#0C6A55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B93A7"/></marker>
  </defs>
  <rect width="1500" height="460" rx="28" fill="url(#bg)"/>
  <rect x="36" y="32" width="1428" height="78" rx="20" fill="url(#hero)"/>
  <text x="72" y="70" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">CareerProof AI</text>
  <text x="72" y="94" font-family="Inter,Arial,sans-serif" font-size="15" fill="#D9F3EA">AI interprets the question. Code calculates the answer. Evidence proves the result.</text>

  <g filter="url(#shadow)">
    <g transform="translate(44,158)"><rect width="178" height="172" rx="18" fill="#FFFFFF" stroke="#C8D8E3"/><circle cx="32" cy="34" r="16" fill="#E8F0FF"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#2F6BFF">1</text><text x="22" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">Dataset</text><text x="22" y="104" font-family="Arial" font-size="13" fill="#627D98">CSV or XLSX</text><text x="22" y="125" font-family="Arial" font-size="13" fill="#627D98">Bundled or uploaded</text><text x="22" y="148" font-family="Arial" font-size="12" fill="#829AB1">Local session only</text></g>
    <g transform="translate(254,158)"><rect width="178" height="172" rx="18" fill="#FFFFFF" stroke="#9FDAC6"/><circle cx="32" cy="34" r="16" fill="#DFF4EC"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#14805E">2</text><text x="22" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">Validate</text><text x="22" y="104" font-family="Arial" font-size="13" fill="#627D98">Schema mapping</text><text x="22" y="125" font-family="Arial" font-size="13" fill="#627D98">Quality checks</text><text x="22" y="148" font-family="Arial" font-size="12" fill="#829AB1">Cleaning ledger</text></g>
    <g transform="translate(464,158)"><rect width="178" height="172" rx="18" fill="#FFFFFF" stroke="#9FDAC6"/><circle cx="32" cy="34" r="16" fill="#DFF4EC"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#14805E">3</text><text x="22" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">Privacy</text><text x="22" y="104" font-family="Arial" font-size="13" fill="#627D98">Detect PII</text><text x="22" y="125" font-family="Arial" font-size="13" fill="#627D98">Mask displays</text><text x="22" y="148" font-family="Arial" font-size="12" fill="#829AB1">Safe exports and logs</text></g>
    <g transform="translate(674,158)"><rect width="178" height="172" rx="18" fill="#F2F5FF" stroke="#A7BFFF"/><circle cx="32" cy="34" r="16" fill="#DDE5FF"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#2F6BFF">4</text><text x="22" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">Local AI</text><text x="22" y="104" font-family="Arial" font-size="13" fill="#627D98">Intent classifier</text><text x="22" y="125" font-family="Arial" font-size="13" fill="#627D98">Entity extraction</text><text x="22" y="148" font-family="Arial" font-size="12" fill="#829AB1">No numerical answers</text></g>
    <g transform="translate(884,158)"><rect width="178" height="172" rx="18" fill="#FFFFFF" stroke="#9FDAC6"/><circle cx="32" cy="34" r="16" fill="#DFF4EC"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#14805E">5</text><text x="22" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">QueryPlan</text><text x="22" y="104" font-family="Arial" font-size="13" fill="#627D98">Structured JSON</text><text x="22" y="125" font-family="Arial" font-size="13" fill="#627D98">Field allowlist</text><text x="22" y="148" font-family="Arial" font-size="12" fill="#829AB1">Refuse if invalid</text></g>
    <g transform="translate(1094,158)"><rect width="178" height="172" rx="18" fill="#FFFFFF" stroke="#9FDAC6"/><circle cx="32" cy="34" r="16" fill="#DFF4EC"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#14805E">6</text><text x="22" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">Calculate</text><text x="22" y="104" font-family="Arial" font-size="13" fill="#627D98">Deterministic Pandas</text><text x="22" y="125" font-family="Arial" font-size="13" fill="#627D98">Sample-size rules</text><text x="22" y="148" font-family="Arial" font-size="12" fill="#829AB1">No eval or exec</text></g>
    <g transform="translate(1304,158)"><rect width="152" height="172" rx="18" fill="#FFF8E8" stroke="#F1C27D"/><circle cx="32" cy="34" r="16" fill="#FFE8B5"/><text x="32" y="39" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#B56608">7</text><text x="20" y="78" font-family="Arial" font-size="17" font-weight="800" fill="#102A43">Evidence</text><text x="20" y="104" font-family="Arial" font-size="13" fill="#627D98">Chart and table</text><text x="20" y="125" font-family="Arial" font-size="13" fill="#627D98">Confidence</text><text x="20" y="148" font-family="Arial" font-size="12" fill="#829AB1">Proof ID and audit</text></g>
  </g>

  <g stroke="#7B93A7" stroke-width="3" marker-end="url(#arrow)">
    <line x1="225" y1="244" x2="247" y2="244"/><line x1="435" y1="244" x2="457" y2="244"/><line x1="645" y1="244" x2="667" y2="244"/><line x1="855" y1="244" x2="877" y2="244"/><line x1="1065" y1="244" x2="1087" y2="244"/><line x1="1275" y1="244" x2="1297" y2="244"/>
  </g>

  <rect x="44" y="360" width="1412" height="62" rx="16" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text x="68" y="388" font-family="Arial" font-size="14" font-weight="800" fill="#102A43">Safe branch:</text>
  <text x="166" y="388" font-family="Arial" font-size="14" fill="#627D98">unsupported field, private-data request, protected-attribute question, unsafe code, or insufficient evidence</text>
  <text x="68" y="410" font-family="Arial" font-size="13" fill="#14805E">The system refuses the conclusion and suggests the closest answerable questions.</text>
</svg>
