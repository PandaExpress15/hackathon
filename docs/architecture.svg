<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CareerProof AI controlled decision architecture</title>
  <desc id="desc">A seven-stage flow from a user profile or question through controlled interpretation, user confirmation, official source routing, hard constraint checks and deterministic calculations, challenge and evidence, and a final human decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030817"/>
      <stop offset="0.58" stop-color="#07142d"/>
      <stop offset="1" stop-color="#11183d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e4160"/>
      <stop offset="1" stop-color="#0b3b34"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="38" fill="url(#grid)"/>
  <circle cx="1290" cy="120" r="240" fill="#8b5cf6" opacity="0.07"/>
  <circle cx="210" cy="760" r="240" fill="#2563eb" opacity="0.08"/>

  <text x="78" y="78" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">CAREERPROOF AI · EXPLAINABLE CAREER DECISION SYSTEM</text>
  <text x="78" y="134" fill="#ffffff" font-family="Arial, sans-serif" font-size="45" font-weight="800">AI interprets. Code calculates. Evidence verifies. You decide.</text>
  <text x="78" y="176" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Every high-impact decision remains inspectable, challengeable, and controlled by the user.</text>

  <g stroke="url(#line)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.92">
    <path d="M222 396H264"/>
    <path d="M452 396H494"/>
    <path d="M682 396H724"/>
    <path d="M912 396H954"/>
    <path d="M1142 396H1184"/>
    <path d="M1372 396H1414"/>
  </g>
  <g fill="#93c5fd">
    <path d="M251 385l18 11-18 11z"/>
    <path d="M481 385l18 11-18 11z"/>
    <path d="M711 385l18 11-18 11z"/>
    <path d="M941 385l18 11-18 11z"/>
    <path d="M1171 385l18 11-18 11z"/>
    <path d="M1401 385l18 11-18 11z"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(130 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="#081c38" stroke="#3b82f6" stroke-width="3"/>
      <circle cy="-76" r="27" fill="#153e75"/><text y="-68" fill="#bfdbfe" font-size="20" font-weight="800">01</text>
      <text y="-22" fill="#fff" font-size="21" font-weight="800">PROFILE OR</text><text y="5" fill="#fff" font-size="21" font-weight="800">QUESTION</text>
      <text y="44" fill="#9fb5cc" font-size="14">Interests · skills · goals</text><text y="67" fill="#9fb5cc" font-size="14">or a natural-language query</text>
      <text y="102" fill="#60a5fa" font-size="12" font-weight="700">USER INPUT</text>
    </g>

    <g transform="translate(360 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="#0a1d3c" stroke="#60a5fa" stroke-width="3"/>
      <circle cy="-76" r="27" fill="#1c477c"/><text y="-68" fill="#dbeafe" font-size="20" font-weight="800">02</text>
      <text y="-22" fill="#fff" font-size="20" font-weight="800">CONTROLLED</text><text y="5" fill="#fff" font-size="20" font-weight="800">INTERPRETATION</text>
      <text y="42" fill="#9fb5cc" font-size="14">Intent · entities · TF-IDF</text><text y="65" fill="#9fb5cc" font-size="14">goals · hard vs soft limits</text>
      <text y="102" fill="#93c5fd" font-size="12" font-weight="700">NO GENERATED CODE</text>
    </g>

    <g transform="translate(590 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="#101d43" stroke="#8b5cf6" stroke-width="3"/>
      <circle cy="-76" r="27" fill="#3f2b7d"/><text y="-68" fill="#ede9fe" font-size="20" font-weight="800">03</text>
      <text y="-22" fill="#fff" font-size="20" font-weight="800">USER</text><text y="5" fill="#fff" font-size="20" font-weight="800">CONFIRMATION</text>
      <text y="42" fill="#b7acd6" font-size="14">Review · edit · approve</text><text y="65" fill="#b7acd6" font-size="14">before ranking or analysis</text>
      <text y="102" fill="#c4b5fd" font-size="12" font-weight="700">HUMAN CONTROL</text>
    </g>

    <g transform="translate(820 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="#071f3b" stroke="#22d3ee" stroke-width="3"/>
      <circle cy="-76" r="27" fill="#0e4a62"/><text y="-68" fill="#cffafe" font-size="20" font-weight="800">04</text>
      <text y="-22" fill="#fff" font-size="20" font-weight="800">OFFICIAL</text><text y="5" fill="#fff" font-size="20" font-weight="800">SOURCE ROUTE</text>
      <text y="42" fill="#9fc8d4" font-size="14">BLS · O*NET · Census</text><text y="65" fill="#9fc8d4" font-size="14">BEA · NCES crosswalks</text>
      <text y="102" fill="#67e8f9" font-size="12" font-weight="700">EXACT CODE JOINS</text>
    </g>

    <g transform="translate(1050 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="#0a2138" stroke="#38bdf8" stroke-width="3"/>
      <circle cy="-76" r="27" fill="#15516d"/><text y="-68" fill="#e0f2fe" font-size="20" font-weight="800">05</text>
      <text y="-31" fill="#fff" font-size="18" font-weight="800">HARD GATE +</text><text y="-5" fill="#fff" font-size="18" font-weight="800">DETERMINISTIC</text><text y="21" fill="#fff" font-size="18" font-weight="800">CALCULATION</text>
      <text y="55" fill="#9fc8d4" font-size="14">Validated rows · formulas</text><text y="78" fill="#9fc8d4" font-size="14">constraints · confidence</text>
      <text y="108" fill="#7dd3fc" font-size="12" font-weight="700">CODE CALCULATES</text>
    </g>

    <g transform="translate(1280 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="#121d3d" stroke="#a78bfa" stroke-width="3"/>
      <circle cy="-76" r="27" fill="#513b82"/><text y="-68" fill="#f3e8ff" font-size="20" font-weight="800">06</text>
      <text y="-31" fill="#fff" font-size="18" font-weight="800">CHALLENGE +</text><text y="-5" fill="#fff" font-size="18" font-weight="800">EVIDENCE</text><text y="21" fill="#fff" font-size="18" font-weight="800">PASSPORT</text>
      <text y="55" fill="#baadd7" font-size="14">Tradeoffs · rows · formula</text><text y="78" fill="#baadd7" font-size="14">limitations · source years</text>
      <text y="108" fill="#c4b5fd" font-size="12" font-weight="700">SAFE REFUSAL</text>
    </g>

    <g transform="translate(1510 396)">
      <rect x="-92" y="-126" width="184" height="252" rx="28" fill="url(#human)" stroke="#34d399" stroke-width="4" filter="url(#glow)"/>
      <circle cy="-76" r="27" fill="#12624c"/><text y="-68" fill="#d1fae5" font-size="20" font-weight="800">07</text>
      <text y="-22" fill="#fff" font-size="21" font-weight="800">HUMAN</text><text y="5" fill="#fff" font-size="21" font-weight="800">DECISION</text>
      <text y="42" fill="#b8e5d2" font-size="14">Compare · save · plan</text><text y="65" fill="#b8e5d2" font-size="14">or request more evidence</text>
      <text y="102" fill="#6ee7b7" font-size="12" font-weight="700">YOU DECIDE</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="610" width="1456" height="184" rx="28" fill="#061326" stroke="#263f62" stroke-width="2"/>
    <text x="104" y="652" fill="#ffffff" font-size="20" font-weight="800">Trust controls that apply across the entire flow</text>
    <g fill="#9fb5cc" font-size="16">
      <text x="104" y="694">• Structured allowlisted operations only</text>
      <text x="104" y="728">• No arbitrary Python or unrestricted SQL</text>
      <text x="104" y="762">• Unsupported and discriminatory questions are refused</text>

      <text x="555" y="694">• Direct, transformed, and derived values are labeled</text>
      <text x="555" y="728">• Source confidence is separate from decision confidence</text>
      <text x="555" y="762">• Missing, suppressed, small-market, and vintage limits stay visible</text>

      <text x="1080" y="694">• Six-dimension resilience model is documented</text>
      <text x="1080" y="728">• Counterfactual presets show what changes the ranking</text>
      <text x="1080" y="762">• Every recommendation can be challenged</text>
    </g>
  </g>

  <text x="800" y="850" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="19" font-weight="700">Eight official source families · 830 occupations · reproducible calculations · human authority preserved</text>
</svg>
